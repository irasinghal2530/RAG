# LLM Configuration for RAG Pipeline
# Settings for language model interactions

llm:
  # Model selection
  provider: "groq"
  model_name: "openai/gpt-oss-20b"
  judge_model_name: "openai/gpt-oss-120b"
  temperature: 0.0
  max_tokens: 2048
  
  # API settings
  api_base: null  # Optional custom endpoint
  timeout: 60
  max_retries: 5

# Prompt templates live in src/generation/prompt_builder.py
# (DEFAULT_SYSTEM_TEMPLATE / DEFAULT_USER_TEMPLATE).

# Generation settings (read by PromptBuilder)
generation:
  include_sources: true
  max_context_length: 12000
  chunk_separator: "\n\n---\n\n"
