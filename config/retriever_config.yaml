# Retriever Configuration for RAG Pipeline
# Settings for document retrieval and search.
# These values are loaded by src/config.py and used by the Retriever,
# the embedder and the evaluation scripts.

# Embedding model settings
embedding:
  model_name: "all-MiniLM-L6-v2"
  embedding_dimension: 384
  use_contextualized: true
  normalize: true  # unit-length vectors so cosine == dot product
  batch_size: 32

# Vector store settings
vector_store:
  provider: "chromadb"
  collection_name: "documents"
  persist_directory: "data/vectordb"
  distance_metric: "cosine"  # applied when the collection is created (re-ingest with --reset after changing)

# Retrieval settings
retrieval:
  top_k: 5            # chunks handed to the LLM after reranking
  candidate_k: 20     # chunks pulled from each first-stage retriever before fusion/reranking

  # Hybrid search settings (BM25 + dense, fused with Reciprocal Rank Fusion)
  hybrid:
    enabled: true
    rrf_k: 60
    bm25_k1: 1.5
    bm25_b: 0.75

# Reranking settings
reranking:
  enabled: true
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# Processing settings (ingestion)
processing:
  do_ocr: false
  do_table_structure: true
  generate_picture_images: true
  images_scale: 2.0
  merge_peers: true
