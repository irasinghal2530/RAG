# Retriever Configuration for RAG Pipeline
# Settings for document retrieval and search

# Embedding model settings
embedding:
  model_name: "all-MiniLM-L6-v2"
  embedding_dimension: 384
  use_contextualized: true
  batch_size: 32

# Vector store settings
vector_store:
  provider: "chromadb"  # chromadb, pinecone, weaviate, qdrant
  collection_name: "documents"
  persist_directory: "data/vectordb"
  distance_metric: "cosine"  # cosine, l2, ip

# Retrieval settings
retrieval:
  top_k: 5
  score_threshold: 0.0  # Minimum similarity score (0.0-1.0)
  
  # Hybrid search settings (BM25 + dense)
  hybrid:
    enabled: false
    alpha: 0.5  # Weight for dense search (1-alpha for BM25)
    bm25_k1: 1.5
    bm25_b: 0.75

# Reranking settings
reranking:
  enabled: false
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # or "cohere-rerank"
  top_k: 3  # Number of results after reranking

# Processing settings
processing:
  # Parser settings
  do_ocr: false
  do_table_structure: true
  generate_picture_images: true
  images_scale: 2.0
  
  # Chunking settings
  merge_peers: true
  chunk_size: 512
  chunk_overlap: 50
